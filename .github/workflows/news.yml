name: 即時新聞

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 每分鐘抓一輪新聞（共 5 輪），存到 news-data 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/news
          git fetch origin news-data 2>/dev/null && git show origin/news-data:news.json > /tmp/news/news.json 2>/dev/null || echo '{}' > /tmp/news/news.json
          for round in 1 2 3 4 5; do
            cp /tmp/news/news.json /tmp/news/before.json
            python scripts/update_news.py /tmp/news/news.json /tmp/news/news.json || true
            if ! cmp -s /tmp/news/news.json /tmp/news/before.json; then
              rm -rf /tmp/push && mkdir /tmp/push && cp /tmp/news/news.json /tmp/push/
              cd /tmp/push
              git init -q && git checkout -q -b news-data && git add news.json
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "即時新聞"
              git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
              cd "$GITHUB_WORKSPACE"
            fi
            if [ "$round" -lt 5 ]; then sleep 50; fi
          done
