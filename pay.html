<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>購買方案｜QEVRAX</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.webmanifest?v=qx1">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=qx1">
<style>
:root{--bg:#0a0d16;--card:#111624;--line:#252d42;--tx:#e8ecf5;--mu:#8b93a7;--pk:#e879c6;--gd:#f1d77a;--ok:#10b981;--bad:#f87171;--warn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{font-size:22px;font-weight:600;letter-spacing:.32em;background:linear-gradient(100deg,#9aa1ad 0%,#e9edf3 35%,#8d939e 60%,#d9b46a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:9.5px;letter-spacing:.24em;color:var(--mu);-webkit-text-fill-color:var(--mu);font-weight:500;margin-top:-2px}
header a{margin-left:auto;color:var(--mu);font-size:13px}
.steps{display:flex;gap:6px;margin:6px 0 16px}.steps span{flex:1;text-align:center;font-size:12px;padding:6px 4px;border-radius:999px;border:1px solid var(--line);color:var(--mu)}
.steps span.on{border-color:var(--pk);color:#fff;background:rgba(232,121,198,.15)}.steps span.done{border-color:rgba(16,185,129,.5);color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:14.5px;margin:14px 0 6px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.plan{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.plan input{position:absolute;opacity:0}.plan.on{border-color:var(--ok);background:rgba(16,185,129,.08)}.plan:focus-within{outline:2px solid var(--ok);outline-offset:2px}
.plan b{font-size:15px}.plan .p{font-size:22px;font-weight:900;color:var(--ok)}.plan em{font-style:normal;font-size:12px;color:var(--warn);font-weight:700}.plan small{color:var(--mu);font-size:12px}
ul.inc{margin:10px 0 0;padding-left:18px;color:var(--mu);font-size:13.5px}
label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=password],input[type=email],input[type=tel],input:not([type]){width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0c1120;color:var(--tx);font-size:16px}
input:focus{outline:2px solid var(--pk);outline-offset:1px}
.row{display:flex;gap:8px;align-items:stretch}.row input{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:#1a2134;color:var(--tx);border-radius:10px;padding:10px 14px;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pk)}.btn:disabled{opacity:.5;cursor:default}.btn.pri{background:linear-gradient(135deg,#e879c6,#a855f7);border:0;color:#fff;width:100%;padding:14px;font-size:16px;margin-top:14px}
.msg{font-size:13px;margin:6px 0 0;min-height:1em}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
details{margin-top:12px}summary{cursor:pointer;color:var(--mu);font-size:13.5px}details pre{white-space:pre-wrap;font:12.5px/1.75 inherit;background:#0c1120;border-radius:10px;padding:10px 12px;max-height:320px;overflow:auto;color:#c4cad6}
ol.notice{margin:0;padding-left:20px;font-size:13.5px;color:#c4cad6}ol.notice li{margin:6px 0}ol.notice b{color:var(--tx)}
.acks{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}.acks h3{margin:0 0 8px}
.ack{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;cursor:pointer}.ack input{flex:none;width:20px;height:20px;margin-top:2px;accent-color:var(--pk)}
.ackn{font-size:12.5px;color:var(--mu);margin-top:4px}
.ver{display:inline-block;font-size:12px;color:var(--gd);border:1px solid rgba(241,215,122,.4);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.hist .btn{padding:6px 10px;font-size:12.5px}
.amt{font-size:40px;font-weight:900;color:var(--ok);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}.kv>span{width:70px;color:var(--mu);font-size:13px}.kv code{font-size:13.5px;word-break:break-all;flex:1;min-width:0}.kv .btn{padding:6px 10px;font-size:12.5px}
.warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);color:#fde68a;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.qr{background:#fff;border-radius:12px;padding:8px;width:184px;height:184px;margin:12px auto 0}.qr:empty{display:none}
.wait{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;color:var(--mu);font-size:13.5px}.dot{width:10px;height:10px;border-radius:50%;background:var(--pk);animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}
.big{text-align:center;padding:20px 8px}.big .ic{font-size:56px}.big h2{font-size:22px;margin:8px 0}
.mute{color:var(--mu);font-size:13px}.who{background:rgba(232,121,198,.1);border:1px solid rgba(232,121,198,.4);border-radius:12px;padding:10px 12px;font-size:14px}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.seg{display:flex;gap:8px;margin-top:4px}.segb{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
.segb input{accent-color:var(--pk)}.segb:has(input:checked){border-color:var(--pk);background:rgba(232,121,198,.12)}
select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0c1120;color:var(--tx);font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo" aria-label="QEVRAX">QEVRAX<small>QUANTITATIVE TRADING ENGINE</small></div><a href="./">← 回網站</a></header>
  <div class="steps" id="steps" aria-label="購買步驟"><span>① 選方案</span><span>② 填資料</span><span>③ 付款</span><span>④ 完成</span></div>
  <main id="app"><div class="card"><p class="mute">載入中…</p></div></main>
</div>
<script>
(() => {
'use strict';
/* ---------- 💳 QEVRAX 獨立繳費頁：新用戶直接購買（付款成功自動建立帳號）、已登入的人續費 ----------
   📜 付款前：購買前須知＋5 項逐項勾選＋服務條款全文（有版本號）＋個人資料告知事項；送出時帶上看到的條款版本，伺服器版本不同就請他重新閱讀 */
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const SRVC = LS.get('quantSrv', {}), URL0 = (SRVC.url || 'https://3-107-254-240.sslip.io').replace(/\/+$/, '');
const S = { mode: 'new', me: null, info: null, m: 1, code: '', q: null, order: null, timer: 0, changed: '' };
const fmt = t => { const d = new Date(t); return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
async function api(path, body, auth) {
  const h = { 'Content-Type': 'application/json' }; if (auth && SRVC.token) h.Authorization = 'Bearer ' + SRVC.token;
  const r = await fetch(URL0 + path, { method: 'POST', headers: h, body: JSON.stringify(body || {}) }); let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(j.error || 'HTTP ' + r.status); e.j = j; throw e; } return j;
}
const step = n => [...$('steps').children].forEach((el, i) => { el.className = i + 1 < n ? 'done' : i + 1 === n ? 'on' : ''; });
const msg = (id, t, ok) => { const el = $(id); if (el) { el.className = 'msg ' + (ok ? 'ok' : 'bad'); el.textContent = t; } };
async function loadInfo() {                              // 方案、條款、須知（續費用登入的資料，新用戶用公開的）
  if (S.mode === 'renew') { const d = await api('/api/bill', { op: 'me' }, true); S.info = { on: d.on && !!d.addr, plans: d.plans, terms: d.terms, state: d.state, price: d.price, days: d.days, termsVer: d.termsVer, notice: d.notice || [], acks: d.acks || [], privacy: d.privacy || '', hist: d.hist || [], mine: d.termsVerMine || '', refundTo: d.refundTo || '', refundKind: d.refundKind || '', refundVia: d.refundVia || '', addr: d.addr || '' }; return d; }
  S.info = await api('/api/buy', { op: 'info' }); return S.info;
}
async function boot() {
  let R = null; try { R = await api('/api/ref', { op: 'info' }); } catch (e) {}   // 🎟 邀請碼制（免費）開著：顯示免費申請
  if (R && R.on) {
    if (SRVC.token) { try { const r = await fetch(URL0 + '/api/me', { headers: { Authorization: 'Bearer ' + SRVC.token } }); if (r.ok) return done0('🎟', '你已經有帳號了', '目前是免費使用（邀請碼制），到網站「☰ 選單 → 方案與繳費」可以看審核狀態。'); } catch (e) {} }
    return refView(R);
  }
  if (SRVC.token) { try { const r = await fetch(URL0 + '/api/me', { headers: { Authorization: 'Bearer ' + SRVC.token } }); if (r.ok) { S.me = await r.json(); S.mode = 'renew'; } } catch (e) {} }
  try { const d = await loadInfo(); if (S.mode === 'renew' && d.state.st === 'free') return done0('🎁', '你是免費帳號', '不用付費，所有功能都可以直接使用。'); }
  catch (e) { return $('app').innerHTML = `<div class="card"><p class="msg bad">連不到伺服器：${esc(e.message)}</p></div>`; }
  if (!S.info.on) return done0('🔒', '目前沒有開放購買', '請稍後再來，或聯絡擁有者。');
  const saved = LS.get('qxPay', null);                   // 重新整理也不會弄丟付款單
  if (saved && saved.exp > Date.now() - 48 * 3600000 && saved.mode === S.mode) { S.order = saved; return payView(); }
  formView();
}
function refView(R) {                                  // 🎟 免費申請：① 用邀請碼註冊 Bitunix → ② 填資料 → ③ 審核
  $('steps').innerHTML = '<span>① 註冊 Bitunix</span><span>② 填資料</span><span>③ 審核</span><span>④ 完成</span>'; step(1);
  document.title = '免費註冊｜QEVRAX';
  const refs = R.refs || [];
  $('app').innerHTML = `<div class="card"><h2>① 先用邀請碼註冊 Bitunix</h2>
    <p class="mute">QEVRAX <b>免費使用</b>，條件是你的 Bitunix 帳號要用我們的邀請碼註冊，並且開著自動交易（近 30 天交易量 ${(+R.minVol || 0).toLocaleString()} USDT 以上，保證金 × 槓桿，小資金也很容易達到）。</p>
    ${refs.length ? `<label class="f" for="via">誰邀請你的？（你用誰的邀請碼註冊 Bitunix）<b style="color:var(--bad)">＊必填</b></label><select id="via"><option value="">請選擇</option>${refs.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select><div id="viaBox"></div>` : ''}
    <p class="mute" style="font-size:12.5px;margin-top:10px">已經有 Bitunix 帳號、但不是用我們的邀請碼註冊的，要用邀請連結<b>重新註冊一個新帳號</b>才能免費使用。<br>申請被拒絕過、或填錯 UID？用<b>同一個信箱</b>重新申請就好，舊的申請會自動作廢。</p></div>
  <div class="card"><h2>② 填資料</h2><p class="mute">送出後會<b>馬上建立帳號</b>，用這組 UID 和密碼登入。審核通過前可以先設定，但還不能開始自動交易。</p>
    <label class="f" for="uid">Bitunix UID（用邀請碼註冊的那個帳號）</label><input id="uid" inputmode="numeric" autocomplete="username" autocapitalize="off">
    <label class="f" for="pw">設定密碼（至少 8 個字）</label><input id="pw" type="password" autocomplete="new-password">
    <label class="f" for="pw2">再輸入一次密碼</label><input id="pw2" type="password" autocomplete="new-password">
    <label class="f" for="em">Google 信箱（收驗證碼、通知、忘記密碼用）</label><div class="row"><input id="em" type="email" autocomplete="email" autocapitalize="off" placeholder="example@gmail.com"><button class="btn" id="sendCode" type="button">寄驗證碼</button></div>
    <label class="f" for="ec">信箱驗證碼（6 位數字）</label><input id="ec" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><p class="msg" id="codeMsg" role="status"></p>
    <label class="f" for="ph">手機號碼</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="0912345678">
    <details><summary>📄 服務條款全文<span class="ver">版本 ${esc(R.termsVer || '')}</span></summary><pre>${esc(R.terms || '')}</pre></details>
    <label class="agree"><input type="checkbox" id="agree"> 我已閱讀並同意服務條款</label>
    <button class="btn pri" id="apply" type="button">送出申請</button><p class="msg" id="aMsg" role="alert"></p></div>`;
  if ($('via')) $('via').onchange = () => { const r = refs.find(x => x.id === $('via').value), box = $('viaBox'); step(1);
    box.innerHTML = r && (r.code || r.link) ? `<div class="kv">${r.code ? `<span>邀請碼</span><code>${esc(r.code)}</code><button class="btn" data-copy="${esc(r.code)}" type="button">複製</button>` : ''}</div>${r.link ? `<p style="margin:8px 0 0"><a class="btn" href="${esc(r.link)}" target="_blank" rel="noopener">👉 用 ${esc(r.name)} 的邀請連結註冊 Bitunix</a></p>` : ''}` : '';
    box.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = '已複製'; } catch (e) { prompt('複製這段：', b.dataset.copy); } }); };
  $('uid').onfocus = () => step(2);
  $('sendCode').onclick = async () => { const b = $('sendCode'); b.disabled = true; try { const r = await api('/api/buy', { op: 'code', email: $('em').value.trim().toLowerCase() }); msg('codeMsg', r.msg, true); let n = 60; const t = setInterval(() => { b.textContent = `${--n} 秒後可重寄`; if (n <= 0) { clearInterval(t); b.disabled = false; b.textContent = '重寄驗證碼'; } }, 1000); } catch (e) { msg('codeMsg', e.message); b.disabled = false; } };
  $('apply').onclick = async () => {
    const b = $('apply'), uid = $('uid').value.normalize('NFKC').replace(/\s+/g, ''), pw = $('pw').value;
    try {
      if (refs.length && !$('via').value) { $('via').focus(); throw new Error('請選是誰邀請你的'); }
      if (!/^\d{4,20}$/.test(uid)) throw new Error('UID 應該是 4～20 位數字（Bitunix 的 UID）'); if (pw.length < 8) throw new Error('密碼至少 8 個字'); if (pw !== $('pw2').value) throw new Error('兩次輸入的密碼不一樣');
      if (!$('agree').checked) throw new Error('請先閱讀並勾選同意服務條款');
      b.disabled = true; msg('aMsg', '送出中…', true);
      const r = await api('/api/ref', { op: 'apply', uid, password: pw, email: $('em').value.trim().toLowerCase(), emailCode: $('ec').value.trim(), phone: $('ph').value.trim(), via: $('via') ? $('via').value : '', agree: true });
      LS.set('quantSrv', { ...SRVC, url: URL0, on: true, token: r.token, uid: r.uid, role: r.role });   // 申請完直接登入
      step(r.st === 'ok' ? 5 : 3);
      $('app').innerHTML = `<div class="card big"><div class="ic">${r.st === 'ok' ? '✅' : '⏳'}</div><h2>${r.st === 'ok' ? '已通過，可以開始使用！' : '申請已送出，審核中'}</h2>
        <p>帳號 <b>${esc(r.uid)}</b> 已經建立，已幫你登入。</p>
        <p class="mute">${r.st === 'ok' ? '你的 UID 在我們的邀請名單裡，已經自動通過。' : '我們會確認你是用我們的邀請碼註冊 Bitunix，通過後會寄信通知你。'}接下來請到網站「☰ 選單 → 設定」設定 Bitunix API（要開交易權限）和特級交易${r.st === 'ok' ? '，再按「開始特級交易」' : '，審核通過就能開始'}。</p>
        <a class="btn pri" href="./" style="display:block;text-decoration:none">前往網站</a></div>`;
    } catch (e) { msg('aMsg', e.message); b.disabled = false; if (e.j && e.j.needLogin) $('aMsg').innerHTML += ' <a href="./">前往登入</a>'; }
  };
}
function done0(ic, t, d) { step(0); $('app').innerHTML = `<div class="card big"><div class="ic">${ic}</div><h2>${t}</h2><p class="mute">${d}</p><a class="btn" href="./">回網站</a></div>`; }
function legalCard(I) {                                  // 📜 購買前須知＋逐項勾選＋條款全文＋個資告知＋歷史版本
  const n = I.notice || [], A = I.acks || [], H = (I.hist || []).slice().reverse();
  return `<div class="card" id="legal"><h2>購買前須知</h2>
    ${S.changed ? `<div class="warn" role="alert">📜 服務條款剛更新為 <b>${esc(S.changed)}</b> 版，請重新閱讀並勾選。</div>` : ''}
    ${S.mode === 'renew' && I.mine && I.mine !== I.termsVer ? `<div class="warn">📜 你上次同意的是 ${esc(/^\d/.test(I.mine) ? I.mine + ' 版' : I.mine)}，現在是 ${esc(I.termsVer)} 版，續費前請重新閱讀並勾選。</div>` : ''}
    <p class="mute">付款前請先看完以下重點，並逐項勾選。</p>
    <ol class="notice">${n.map(([t, d]) => `<li><b>${esc(t)}</b>：${esc(d)}</li>`).join('')}</ol>
    <details><summary>📄 服務條款全文<span class="ver">版本 ${esc(I.termsVer || '')}</span></summary><pre>${esc(I.terms)}</pre></details>
    <details><summary>🔒 個人資料告知事項</summary><pre>${esc(I.privacy || '')}</pre></details>
    ${H.length > 1 ? `<details><summary>🗂 條款的歷史版本（${H.length} 版）</summary><div class="hist">${H.map(h => `<button class="btn" type="button" data-ver="${esc(h.ver)}">${esc(h.ver)}${h.ver === I.termsVer ? '（目前）' : ''}</button>`).join('')}</div><pre id="histTx" hidden></pre></details>` : ''}
    <div class="acks" role="group" aria-labelledby="ackT"><h3 id="ackT">付款前必須逐項勾選</h3>${A.map((t, i) => `<label class="ack"><input type="checkbox" class="ackc" data-i="${i}"><span>${esc(t)}</span></label>`).join('')}<p class="ackn" id="ackN" aria-live="polite">已勾選 0／${A.length}</p></div></div>`;
}
const RF_LIST = { wallet: ['TronLink', 'Trust Wallet', 'imToken', 'TokenPocket', 'OKX Wallet', 'Bitget Wallet', 'SafePal', 'Ledger', '其他'], cex: ['Bitunix', '幣安 Binance', 'OKX', 'Bybit', 'Bitget', 'MEXC', 'Gate', 'HTX（火幣）', 'KuCoin', '幣託 BitoPro', 'MAX', '派網 Pionex', '其他'] };
S.rf = null;                                             // 退款方式：{ k: 'wallet'|'cex', via, other }
function rfSetup() {                                     // 退款方式：錢包／交易所 → 哪一個 → 地址（不同提示）
