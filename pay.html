const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

/* 🔐 密碼安全：跟伺服器一樣擋太弱的密碼；再用 Have I Been Pwned 查是不是外洩過（只送 SHA-1 的前 5 碼，密碼本身不會離開瀏覽器）。查不到（離線）就略過 */
const PW_COMMON = new Set(['password', 'password1', 'passw0rd', 'p@ssw0rd', 'qwertyui', 'qwerty123', 'qwertyuiop', '1qaz2wsx', '1q2w3e4r', '1q2w3e4r5t', 'abcd1234', 'abc12345', 'a1234567', 'aa123456', 'a12345678', 'zxcvbnm1', 'iloveyou', 'asdfghjk', 'asdf1234', 'qwer1234', '12341234', '11223344', '12344321', '5201314a', 'woaini1314', 'admin123', 'test1234', '12qwaszx', 'qazwsxedc', '1qaz2wsx3edc', 'qwe12345', 'aaaa1111', 'abc123456', 'q1w2e3r4', 'zaq12wsx', 'bitunix123', 'qevrax123']);
function pwWeak(pw, uid) {
  const p = String(pw || ''), l = p.toLowerCase(); if (p.length < 8) return '';

    <label class="f" for="code">邀請碼（選填）</label><div class="row"><input id="code" value="${esc(S.code)}" autocomplete="off" placeholder="有的話可以打折"><button class="btn" id="quote" type="button">套用</button></div><p class="msg" id="qMsg" role="status"></p></div>
  ${legalCard(I)}
  <div class="card"><button class="btn pri" id="go" type="button" style="margin-top:0">產生付款單（<span id="goAmt">${S.q && S.q.m === S.m ? S.q.price : p0.price}</span> USDT）</button><p class="msg" id="goMsg" role="alert"></p></div>`;
  document.querySelectorAll('input[name=m]').forEach(r => r.onchange = () => { S.m = +r.value; S.code = $('code').value.trim(); keep(); formView(); restore(); });
  $('quote').onclick = async () => { const c = $('code').value.trim(); try { const q = await api('/api/buy', { op: 'quote', code: c, m: S.m }); S.q = q; S.code = c; $('goAmt').textContent = q.price; msg('qMsg', q.code ? `✓ ${q.code} 折 ${q.pct}%：${q.price} USDT` : `原價 ${q.price} USDT`, true); } catch (e) { msg('qMsg', e.message); } };
  if ($('sendCode')) $('sendCode').onclick = async () => { const b = $('sendCode'); b.disabled = true; try { const r = await api('/api/buy', { op: 'code', email: $('em').value.trim().toLowerCase() }); msg('codeMsg', r.msg, true); let n = 60; const t = setInterval(() => { b.textContent = `${--n} 秒後可重寄`; if (n <= 0) { clearInterval(t); b.disabled = false; b.textContent = '重寄驗證碼'; } }, 1000); } catch (e) { msg('codeMsg', e.message); b.disabled = false; } };
  const ackCount = () => [...document.querySelectorAll('.ackc')].filter(x => x.checked).length;
  document.querySelectorAll('.ackc').forEach(c => c.onchange = () => { $('ackN').textContent = `已勾選 ${ackCount()}／${(S.info.acks || []).length}`; });
  document.querySelectorAll('[data-ver]').forEach(b => b.onclick = async () => { const p = $('histTx'); p.hidden = false; p.textContent = '讀取中…'; try { const r = await api('/api/buy', { op: 'terms', ver: b.dataset.ver }); p.textContent = `【${r.ver}${/^\d/.test(r.ver) ? ' 版' : ''}】\n\n${r.text}`; } catch (e) { p.textContent = e.message; } });
  $('go').onclick = () => order(ackCount());
  rfSetup();
}
let KEEP = {};                                           // 換方案、條款更新重畫時保留已經填的資料
function keep() { for (const k of ['uid', 'pw', 'pw2', 'em', 'ec', 'ph', 'rf', 'code']) if ($(k)) KEEP[k] = $(k).value; }
function restore() { for (const [k, v] of Object.entries(KEEP)) if ($(k)) $(k).value = v; }
async function order(n) {
  const need = (S.info.acks || []).length;
  if (n < need) { msg('goMsg', `請先逐項勾選「付款前必須逐項勾選」（還差 ${need - n} 項）`); $('legal').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const b = $('go'); b.disabled = true; msg('goMsg', '建立付款單中…', true);
  const legal = { agree: true, acks: n, termsVer: S.info.termsVer };
  try {
    let o; const refundTo = $('rf').value.trim();
    if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(refundTo)) { $('rf').focus(); throw new Error('請填退款地址：USDT（TRC20）地址是 T 開頭、34 個英數字；從交易所付款的話，填你在交易所的充值地址'); }
    const R = S.rf || {}, refundKind = R.k, refundVia = (R.via === '其他' ? (R.other || '').trim() : R.via) || '';
    if (!refundKind) { throw new Error('請選退款方式：自己的錢包，還是交易所'); }
    if (!refundVia) { $(R.via === '其他' ? 'rfOther' : 'rfVia').focus(); throw new Error(refundKind === 'cex' ? '請選是哪一家交易所' : '請選是哪一個錢包'); }
    if (S.info.addr && refundTo === S.info.addr) { $('rf').focus(); throw new Error('退款地址不能填我們的收款地址：請填你自己的錢包地址，或你在交易所的充值地址'); }
    if (S.mode === 'renew') { const r = await api('/api/bill', { op: 'order', code: $('code').value.trim(), m: S.m, refundTo, refundKind, refundVia, ...legal }, true); o = { ...r.order, mode: 'renew' }; }
    else {
      const uid = $('uid').value.normalize('NFKC').replace(/\s+/g, ''), pw = $('pw').value;
      if (!/^\d{4,20}$/.test(uid)) throw new Error('UID 應該是 4～20 位數字'); if (pw.length < 8) throw new Error('密碼至少 8 個字'); if (pw !== $('pw2').value) throw new Error('兩次輸入的密碼不一樣');
      const r = await api('/api/buy', { op: 'order', uid, password: pw, email: $('em').value.trim().toLowerCase(), emailCode: $('ec').value.trim(), phone: $('ph').value.trim(), m: S.m, code: $('code').value.trim(), refundTo, refundKind, refundVia, ...legal });
      o = { ...r.order, otok: r.otok, mode: 'new', refundTo, refundKind, refundVia };
    }
    o.termsVer = S.info.termsVer; S.order = o; LS.set('qxPay', o); payView();
  } catch (e) {
    if (e.j && e.j.termsChanged) { keep(); try { await loadInfo(); } catch (err) {} S.changed = S.info.termsVer; formView(); restore(); $('legal').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }   // 條款剛好改版：重新讀取，請他再看一次
    msg('goMsg', e.message); b.disabled = false; if (e.j && e.j.needLogin) $('goMsg').innerHTML += ' <a href="./">前往登入</a>';
  }
}
function payView() {
  step(3); const o = S.order;
  $('app').innerHTML = `<div class="card"><h2>③ 付款</h2>
    <div class="warn">⚠️ 只能用 <b>TRON（TRC20）</b>網路轉 <b>USDT</b>。從交易所提領的話，請把提領手續費加上去，讓<b>「實際到帳」剛好等於下面的金額</b>。到帳不足會全額退回；多轉的話方案照常開通，多出來的部分會退回。</div>
    <div class="warn">💡 建議用<b>自己的錢包</b>（TronLink、Trust Wallet 等）付款。從交易所（Bitunix、幣安等）<b>直接提領</b>的話，區塊鏈上的付款地址是<b>交易所的</b>，日後如果要退款，退回去<b>不會自動進你的帳戶</b>，所以退款會轉到你填的<b>退款地址</b>（下面可以看到，退款完成前也能改）。</div>
    <div class="kv"><span>金額</span><b class="amt" id="amt">${o.amount}</b><button class="btn" data-copy="${o.amount}">複製</button></div>
    <div class="kv"><span>收款地址</span><code>${esc(o.addr)}</code><button class="btn" data-copy="${esc(o.addr)}">複製</button></div>
    <div class="kv"><span>網路</span><b>TRON（TRC20）</b></div>
    <div class="kv"><span>方案</span><b>${o.m || 1} 個月${o.code ? `・邀請碼 ${esc(o.code)} −${o.pct}%` : ''}</b></div>
    ${o.refundTo ? `<div class="kv"><span>退款地址</span><code>${esc(o.refundTo)}</code>${o.refundVia ? `<small class="mute">${o.refundKind === 'cex' ? '🏦 ' + esc(o.refundVia) + ' 充值地址' : '👛 ' + esc(o.refundVia) + ' 錢包'}</small>` : ''}</div>` : ''}
    <div class="kv"><span>帳號</span><b>${esc(o.uid || (S.me && S.me.uid) || '')}</b></div>
    ${o.termsVer ? `<div class="kv"><span>條款</span><b>你同意的是 ${esc(o.termsVer)} 版</b></div>` : ''}
    <div class="qr" id="qr" aria-label="收款地址 QR code"></div>
    <div class="wait" id="wait"><i class="dot" aria-hidden="true"></i><span id="waitT">等待付款中…（剩 <b id="left">—</b>）</span></div>
    <div id="refund"></div>
    <details><summary>🙋 已經轉帳，但一直沒有確認？</summary><p class="mute">貼上這筆轉帳的交易編號（或 Tronscan 連結），系統會到區塊鏈確認。</p><div class="row"><input id="tx" placeholder="交易編號（64 個英數字）" autocomplete="off" spellcheck="false"><button class="btn" id="claim" type="button">查詢</button></div><p class="msg" id="cMsg" role="status"></p></details>
    <p style="margin-top:14px"><button class="btn" id="cancel" type="button">取消這張付款單</button></p></div>`;
  qr(o.addr);
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = '已複製'; setTimeout(() => b.textContent = '複製', 1500); } catch (e) { prompt('複製這段：', b.dataset.copy); } });
  $('cancel').onclick = async () => { if (!confirm('取消這張付款單？已經轉帳的話請不要取消。')) return; try { if (o.mode === 'renew') await api('/api/bill', { op: 'cancel', id: o.id }, true); else await api('/api/buy', { op: 'cancel', id: o.id, otok: o.otok }); } catch (e) {} LS.del('qxPay'); S.order = null; clearInterval(S.timer); try { await loadInfo(); } catch (e) {} formView(); };
  $('claim').onclick = async () => { msg('cMsg', '查詢中…（最多 30 秒）', true); try { const r = o.mode === 'renew' ? await api('/api/bill', { op: 'claim', tx: $('tx').value }, true) : await api('/api/buy', { op: 'claim', id: o.id, otok: o.otok, tx: $('tx').value }); msg('cMsg', r.msg, true); poll(); } catch (e) { msg('cMsg', e.message); } };
  clearInterval(S.timer); S.timer = setInterval(poll, 10000); poll(); tick(); setInterval(tick, 1000);
}
function tick() { const o = S.order, el = $('left'); if (!o || !el) return; const s = Math.max(0, Math.floor((o.exp - Date.now()) / 1000)); el.textContent = s ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : '已過期（48 小時內轉帳仍會確認）'; }
async function poll() {
  const o = S.order; if (!o) return;
  try {
    let st, until = 0, refund = [];
    if (o.mode === 'renew') { const d = await api('/api/bill', { op: 'poll' }, true), x = (d.orders || []).find(y => y.id === o.id); st = x ? x.status : 'cancel'; until = d.state.paidUntil; refund = (d.refunds || []).filter(r => r.orderId === o.id); }
    else { const d = await api('/api/buy', { op: 'status', id: o.id, otok: o.otok }); st = d.status; until = d.until; refund = d.refund || []; }
    const RB = $('refund'), key = JSON.stringify(refund.map(r => [r.id, r.status, r.to || r.from]));   // 內容有變才重畫，不會打斷正在輸入的地址
    if (RB && RB.dataset.k !== key) { RB.dataset.k = key; RB.innerHTML = refund.length ? refHtml(refund, o) : ''; refBind(o); }
    if (st === 'paid') { clearInterval(S.timer); LS.del('qxPay'); success(until); }
    else if (st === 'cancel') { clearInterval(S.timer); LS.del('qxPay'); S.order = null; formView(); }
  } catch (e) { if (/找不到這張付款單/.test(e.message)) { clearInterval(S.timer); LS.del('qxPay'); S.order = null; return formView(); } if ($('waitT')) $('waitT').textContent = '連線不穩，稍後自動重試…'; }
}
function refHtml(refund, o) {                          // ↩️ 金額不對要退款：顯示退到哪，退款完成前可以改成自己的充值地址
  return `<div class="warn">↩️ 收到 ${refund.map(r => `${r.amount} USDT`).join('、')}，金額不對，會全額退回（${refund.every(r => r.status === 'done') ? '已退款' : '退款處理中'}）。請重新轉帳，實際到帳要剛好是 <b>${o.amount}</b>。</div>` +
    refund.map(r => { const to = r.to || r.from, own = to !== r.from;
      return `<div class="kv"><span>退回到</span><code>${esc(to)}</code><small class="mute">${(lab => lab ? esc(lab) : own ? '你指定的地址' : '你付款的錢包')(r.label || (r.toVia ? (r.toKind === 'cex' ? r.toVia + ' 交易所充值地址' : r.toVia + ' 錢包') : ''))}</small></div>` + (r.status === 'todo' && r.id ? `
      <details${own ? '' : ' open'}><summary>從交易所直接提領付款的？改成退到你自己的充值地址</summary><p class="mute">到交易所的「充值 → USDT」，網路選 <b>TRC20（TRON）</b>，把充值地址貼在這裡。退款完成前都可以改。</p>
      <div class="row"><input data-rtoin="${esc(r.id)}" placeholder="你的 USDT（TRC20）充值地址，T 開頭" autocomplete="off" spellcheck="false" autocapitalize="off"><button class="btn" data-rto="${esc(r.id)}" type="button">改退款地址</button></div><p class="msg" data-rtomsg="${esc(r.id)}" role="status"></p></details>` : ''); }).join('');
}
function refBind(o) {
  document.querySelectorAll('[data-rto]').forEach(b => b.onclick = async () => {
    const id = b.dataset.rto, to = document.querySelector(`[data-rtoin="${id}"]`).value.trim(), m = document.querySelector(`[data-rtomsg="${id}"]`);
    if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(to)) { m.className = 'msg bad'; m.textContent = '地址格式不對：TRON 地址是 T 開頭、34 個英數字'; return; }
    if (to === o.addr) { m.className = 'msg bad'; m.textContent = '退款地址不能填我們的收款地址'; return; }
    if (!confirm(`退款改成轉到這個地址？\n\n${to}\n\n請再確認一次：這是 USDT（TRC20／TRON 網路）的地址，轉錯網路的錢拿不回來。`)) return;
    b.disabled = true;
    try { if (o.mode === 'renew') await api('/api/bill', { op: 'refundTo', id, to }, true); else await api('/api/buy', { op: 'refundTo', id: o.id, otok: o.otok, rid: id, to });
      delete $('refund').dataset.k; poll(); }
    catch (e) { m.className = 'msg bad'; m.textContent = e.message; b.disabled = false; }
  });
}
function success(until) {
  step(5); const o = S.order, isNew = o.mode === 'new';
  $('app').innerHTML = `<div class="card big"><div class="ic">✅</div><h2>付款成功！</h2>
    <p>${isNew ? `帳號 <b>${esc(o.uid)}</b> 已經建立，用你剛剛設定的密碼登入。` : '方案已經延長。'}</p>${until ? `<p class="mute">方案到期：${fmt(until)}</p>` : ''}
    <p class="mute">收據已寄到你的信箱。付款後 7 天內可以無條件申請全額退款（寄信到 moocow0216@gmail.com）。${isNew ? '登入後請到「☰ 選單 → 設定」設定 Bitunix API，才能開始自動交易。' : ''}</p>
    <a class="btn pri" href="./" style="display:block;text-decoration:none">${isNew ? '前往登入' : '回網站'}</a></div>`;
}
let QRS = null;
function qr(text, id, size) { const el = $(id || 'qr'); if (!el) return; const draw = () => { el.innerHTML = ''; try { new QRCode(el, { text, width: size || 168, height: size || 168, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} };
  if (window.QRCode) return draw(); if (!QRS) { QRS = document.createElement('script'); QRS.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; document.head.appendChild(QRS); } QRS.addEventListener('load', draw, { once: true }); }
boot();
})();
</script>
